(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='deA1.trainer.v1';
const S={speed:.65,theme:'auto',ex:true,tr:true,reviews:0,diff:[],studied:[],heard:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const D=new Set(S.diff),ST=new Set(S.studied),H=new Set(S.heard);
const save=()=>{S.diff=[...D];S.studied=[...ST];S.heard=[...H];try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const W=VOCAB.map((w,i)=>Object.assign({},w,{i,id:w.id||w.de+(w.note||''),cat:w.art?'Noun':w.forms?'Verb':'Other'}));
const A=w=>w.art?w.art.split('/')[0]:'';
const spoken=w=>(A(w)?A(w)+' ':'')+w.de.replace(/\|/g,'');
const opt=(a,v)=>a.map(x=>`<option value="${x[0]}"${String(x[0])===String(v)?' selected':''}>${x[1]}</option>`).join('');
const SPEEDS=[[.5,'0.5×'],[.65,'0.65×'],[.8,'0.8×'],[1,'1.0×']];

/* ---------- speech ---------- */
let voice=null,cur=null,warned=false,tt=0;
const hasTTS='speechSynthesis' in window;
const pick=()=>{const v=speechSynthesis.getVoices();voice=v.find(x=>x.lang.replace('_','-')==='de-DE')||v.find(x=>/^de/i.test(x.lang))||null};
if(hasTTS){pick();speechSynthesis.onvoiceschanged=pick}
function toast(m,ms){const n=$('#now');n.textContent=m;n.hidden=false;clearTimeout(tt);if(ms)tt=setTimeout(()=>{if(!cur)n.hidden=true},ms)}
function clearPlay(){cur=null;document.querySelectorAll('.playing').forEach(b=>b.classList.remove('playing'));$('#now').hidden=true}
function say(text,id,btn){
 if(!hasTTS){toast('Speech is not supported in this browser',3000);return}
 speechSynthesis.cancel();clearPlay();
 const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=S.speed;if(voice)u.voice=voice;cur=u;
 if(btn)btn.classList.add('playing');toast('🔊 '+text);
 u.onend=u.onerror=()=>{if(cur===u)clearPlay()};
 if(!voice&&!warned&&speechSynthesis.getVoices().length){warned=true;setTimeout(()=>toast('No German voice installed – using the device default',3500),0)}
 if(id){H.add(id);save()}
 setTimeout(()=>speechSynthesis.speak(u),40);
}
function setSpeed(v){S.speed=+v;save();$('#spd').value=v;if(view==='set')go('set')}

/* ---------- shared pieces ---------- */
const isD=w=>D.has(w.id);
const dBtn=w=>`<button class="btn" data-a="d" data-id="${w.i}" aria-pressed="${isD(w)}">${isD(w)?'★':'☆'} Difficult</button>`;
const eBtn=w=>w.ex?`<button class="btn" data-a="e" data-id="${w.i}">🔊 Example</button>`:'';
const info=w=>(w.pl?`<p class="m">Plural: <b>${esc(w.pl)}</b></p>`:'')+(w.forms?`<p class="m">${esc(w.forms)}</p>`:'')+(S.tr&&w.en?`<p class="en">${esc(w.en)}</p>`:'')+(S.ex&&w.ex?`<p class="ex">${esc(w.ex)}</p>`:'');
const badge=w=>`<span class="badge ${A(w)||'x'}">${esc(w.art||'–')}</span>`;
function card(w){return `<article class="card"><div class="row">${badge(w)}<h3 class="de">${esc(w.de)}</h3>${w.note?`<small>${esc(w.note)}</small>`:''}</div>${info(w)}
<div class="btns"><button class="btn" data-a="w" data-id="${w.i}">🔊 Word</button>${eBtn(w)}${dBtn(w)}</div></article>`}

/* ---------- vocabulary + difficult lists ---------- */
const LS={list:{q:'',art:'all',cat:'all',sort:'az',n:60},diff:{q:'',art:'all',cat:'all',sort:'az',n:60}};
const src=k=>k==='diff'?W.filter(isD):W;
function filt(a,s){
 const q=s.q.trim().toLowerCase();
 const r=a.filter(w=>(s.art==='all'||(s.art==='other'?!w.art:(w.art||'').split('/').includes(s.art)))&&(s.cat==='all'||w.cat===s.cat)&&(!q||[w.de,w.ex,w.forms,w.pl,w.en].join(' ').toLowerCase().includes(q)));
 const az=(x,y)=>x.de.localeCompare(y.de,'de',{sensitivity:'base'});
 const f={az,za:(x,y)=>az(y,x),art:(x,y)=>(A(x)||'z').localeCompare(A(y)||'z')||az(x,y),diff:(x,y)=>isD(y)-isD(x)||az(x,y),new:(x,y)=>ST.has(x.id)-ST.has(y.id)||az(x,y)}[s.sort]||az;
 return r.sort(f);
}
function upd(k){
 const s=LS[k],r=filt(src(k),s);
 $('#cnt').textContent=r.length+' matching word'+(r.length===1?'':'s');
 $('#res').innerHTML=r.slice(0,s.n).map(card).join('')+(r.length>s.n?`<button class="btn" style="width:100%" data-a="more">Show more (${r.length-s.n} left)</button>`:'')||'<p class="m">No words found.</p>';
}
function vList(k){
 const s=LS[k];
 return `<h2>${k==='diff'?'⭐ Difficult words':'📚 Vocabulary'}</h2>
 ${k==='diff'&&D.size?'<button class="btn p" style="width:100%;margin-bottom:12px" data-a="drill">🃏 Practise these in flashcards</button>':''}
 ${k==='diff'&&!D.size?'<p class="card m">No difficult words yet. Tap ☆ Difficult on any word to collect it here.</p>':''}
 <div class="card"><input id="q" type="search" placeholder="Search German, plural, example…" value="${esc(s.q)}" aria-label="Search words">
 <div class="grid"><select id="fa" aria-label="Filter by article">${opt([['all','All articles'],['der','der'],['die','die'],['das','das'],['other','Other (no article)']],s.art)}</select>
 <select id="fcat" aria-label="Filter by type">${opt([['all','All types'],['Noun','Nouns'],['Verb','Verbs (forms given)'],['Other','Other']],s.cat)}</select>
 <select id="fs" aria-label="Sort">${opt([['az','Sort: A → Z'],['za','Sort: Z → A'],['art','Sort: by article'],['diff','Sort: difficult first'],['new','Sort: not studied first']],s.sort)}</select></div></div>
 <p class="m" id="cnt"></p><div id="res"></div>`;
}
function bindList(k){
 const s=LS[k];
 const on=(id,key,ev)=>$(id).addEventListener(ev,e=>{s[key]=e.target.value;s.n=60;upd(k)});
 on('#q','q','input');on('#fa','art','change');on('#fcat','cat','change');on('#fs','sort','change');upd(k);
}

/* ---------- flashcards ---------- */
const F={deck:'all',shuf:false,ord:[],pos:0,show:false,cnt:false};
function fcBuild(){
 let a=W.filter(w=>F.deck==='all'||(F.deck==='diff'?isD(w):!ST.has(w.id))).map(w=>w.i);
 if(F.shuf)for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}
 F.ord=a;F.pos=0;F.show=false;F.cnt=false;
}
const vFc=()=>`<h2>🃏 Flashcards</h2><div class="card"><div class="grid">
<select id="fdeck" aria-label="Deck">${opt([['all','All words'],['diff','Difficult words only'],['new','Not studied yet']],F.deck)}</select>
<label class="opt" style="border:0"><span>Shuffle</span><input type="checkbox" id="fshuf"${F.shuf?' checked':''}></label></div></div><div id="fcb"></div>`;
function fcDraw(){
 const w=W[F.ord[F.pos]],el=$('#fcb');
 if(!w){el.innerHTML='<p class="card m">No cards in this deck.</p>';return}
 if(F.show&&!F.cnt){F.cnt=true;ST.add(w.id);S.reviews++;save()}
 const extra=F.show&&!w.art&&!w.pl&&!w.forms&&!w.en&&!w.ex?'<p class="m c">No further details in the source list.</p>':'';
 el.innerHTML=`<p class="m c">Card ${F.pos+1} of ${F.ord.length}</p>
 <article class="card"><p class="de big">${esc(w.de)}</p>${w.note?`<p class="m c">${esc(w.note)}</p>`:''}
 ${F.show?`<div class="c">${badge(w)}</div><div class="c">${info(w)}</div>${extra}`:'<p class="m c">Recall the article, plural and use – then reveal.</p>'}</article>
 <div class="btns"><button class="btn" data-a="prev">‹ Previous</button><button class="btn p" data-a="show">${F.show?'Hide answer':'Show Answer'}</button><button class="btn" data-a="next">Next ›</button></div>
 <div class="btns"><button class="btn" data-a="w" data-id="${w.i}">🔊 Listen</button>${F.show?eBtn(w):''}${dBtn(w)}</div>`;
}
function bindFc(){
 $('#fdeck').addEventListener('change',e=>{F.deck=e.target.value;fcBuild();fcDraw()});
 $('#fshuf').addEventListener('change',e=>{F.shuf=e.target.checked;fcBuild();fcDraw()});
 if(!F.ord.length||F.fresh)fcBuild();F.fresh=false;fcDraw();
}

/* ---------- active recall ---------- */
const R={mode:'mix',pool:'all',w:null,t:'',done:false,res:''};
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const clozeRe=w=>new RegExp('(^|[^\\p{L}])('+escRe(w.de.replace(/\|/g,''))+')(?![\\p{L}])','iu');
function types(w){const t=[];if(w.art)t.push('article');if(w.art&&w.pl)t.push('plural');if(w.ex&&clozeRe(w).test(w.ex))t.push('cloze');t.push('listen');if(S.tr&&w.en)t.push('meaning');return t}
function rNext(){
 const pool=R.pool==='diff'?W.filter(isD):W;R.done=false;R.res='';
 if(!pool.length){R.w=null;rDraw();return}
 let w,t='',n=0;
 do{w=pool[Math.random()*pool.length|0];const a=types(w);t=R.mode==='mix'?a[Math.random()*a.length|0]:(a.includes(R.mode)?R.mode:'')}while(!t&&++n<3000);
 R.w=w;R.t=t||'listen';rDraw();
}
const vRc=()=>`<h2>🧠 Active Recall</h2><div class="card"><div class="grid">
<select id="rmode" aria-label="Question type">${opt([['mix','Mixed questions'],['article','Article'],['plural','Plural'],['cloze','Example with a gap'],['listen','Listening'],['meaning','Meaning (if available)']],R.mode)}</select>
<select id="rpool" aria-label="Words">${opt([['all','All words'],['diff','Difficult words only']],R.pool)}</select></div></div><div id="rcb"></div>`;
function rDraw(){
 const w=R.w,el=$('#rcb');
 if(!w){el.innerHTML='<p class="card m">No words available for this selection.</p>';return}
 const nm=(w.art?w.art+' ':'')+w.de;let q='',ans='';
 if(R.t==='article'){
  q=`<p class="de big">${esc(w.de)}</p><p class="m c">Which article does this noun take?</p>`;
  ans=`<p class="c"><b>${esc(nm)}</b></p>`+(w.pl?`<p class="m c">Plural: ${esc(w.pl)}</p>`:'');
 }else if(R.t==='plural'){
  q=`<p class="de big">${esc(nm)}</p><p class="m c">What is the plural? (The source lists it as an ending.)</p>`;
  ans=`<p class="c">Plural: <b>${esc(w.pl)}</b></p>`;
 }else if(R.t==='cloze'){
  q=`<p class="ex big">${esc(w.ex).replace(clozeRe({de:esc(w.de)}),'$1_____')}</p><p class="m c">Which word fills the gap?</p>`;
  ans=`<p class="c"><b>${esc(nm)}</b></p><p class="ex c">${esc(w.ex)}</p>`;
 }else if(R.t==='meaning'){
  q=`<p class="de big">${esc(w.en)}</p><p class="m c">Say it in German.</p>`;
  ans=`<p class="c"><b>${esc(nm)}</b></p>`;
 }else{
  q=`<p class="de big">🔊 ?</p><p class="m c">Listen, then recall the word and what it means.</p>`;
  ans=`<p class="c"><b>${esc(nm)}</b></p>`+info(w);
 }
 let act;
 if(R.t==='article'&&!R.done)act=['der','die','das'].map(a=>`<button class="btn" data-a="pick" data-id="${a}">${a}</button>`).join('');
 else if(!R.done)act='<button class="btn p" data-a="rshow">Show Answer</button>';
 else if(R.t==='article')act='<button class="btn p" data-a="rnext">Next ›</button>';
 else act='<button class="btn p" data-a="knew">✓ Knew it</button><button class="btn" data-a="miss">✗ Missed</button>';
 el.innerHTML=`<article class="card">${q}${R.res?`<p class="c"><b>${R.res==='ok'?'✓ Correct':'✗ Not quite'}</b></p>`:''}${R.done?ans:''}</article>
 <div class="btns">${act}</div>
 <div class="btns"><button class="btn" data-a="w" data-id="${w.i}">🔊 Word</button>${R.done?eBtn(w):''}${dBtn(w)}</div>`;
}
function bindRc(){
 $('#rmode').addEventListener('change',e=>{R.mode=e.target.value;rNext()});
 $('#rpool').addEventListener('change',e=>{R.pool=e.target.value;rNext()});
 rNext();
}

/* ---------- progress + settings ---------- */
const bar=(l,n,t)=>`<div class="card"><div class="row sp"><b>${l}</b><span>${n} / ${t} · ${t?Math.round(n/t*100):0}%</span></div><div class="bar"><i style="width:${t?n/t*100:0}%"></i></div></div>`;
const vProg=()=>{const t=W.length;return `<h2>📊 Progress</h2>
<div class="card row sp"><span>Total words</span><span class="stat">${t}</span></div>
${bar('Studied',ST.size,t)}${bar('Difficult',D.size,t)}${bar('Listened to',H.size,t)}
<div class="card row sp"><span>Flashcards reviewed</span><span class="stat">${S.reviews}</span></div>`};
const vSet=()=>`<h2>⚙️ Settings</h2><div class="card">
<div class="opt"><span>Speech speed</span><div class="btns" style="margin:0">${SPEEDS.map(x=>`<button class="btn${S.speed===x[0]?' p':''}" data-a="spd" data-id="${x[0]}">${x[1]}</button>`).join('')}</div></div>
<div class="opt"><span>Theme</span><select id="theme" style="width:auto">${opt([['auto','Automatic'],['light','Light'],['dark','Dark']],S.theme)}</select></div>
<label class="opt"><span>Show example sentences</span><input type="checkbox" id="sex"${S.ex?' checked':''}></label>
<label class="opt"><span>Show translations (when available)</span><input type="checkbox" id="str"${S.tr?' checked':''}></label>
<div class="opt"><span>German voice:<br><small>${voice?esc(voice.name+' ('+voice.lang+')'):'none found – device default is used'}</small></span><button class="btn" style="flex:none" data-a="test">🔊 Test</button></div>
<div class="opt"><span>Progress and difficult words</span><button class="btn" style="flex:none" data-a="reset">Reset progress</button></div></div>`;
function bindSet(){
 $('#theme').addEventListener('change',e=>{S.theme=e.target.value;save();theme()});
 $('#sex').addEventListener('change',e=>{S.ex=e.target.checked;save()});
 $('#str').addEventListener('change',e=>{S.tr=e.target.checked;save()});
}
function theme(){if(S.theme==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=S.theme}

/* ---------- navigation + events ---------- */
let view='list';
const V={list:()=>vList('list'),diff:()=>vList('diff'),fc:vFc,rc:vRc,prog:vProg,set:vSet};
const B={list:()=>bindList('list'),diff:()=>bindList('diff'),fc:bindFc,rc:bindRc,set:bindSet};
function go(v){
 if(hasTTS)speechSynthesis.cancel();clearPlay();view=v;
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 $('#app').innerHTML=V[v]();if(B[v])B[v]();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');
 if(b){
  const a=b.dataset.a,w=W[+b.dataset.id];
  if(a==='w')say(spoken(w),w.id,b);
  else if(a==='e')say(w.ex,w.id,b);
  else if(a==='d'){if(isD(w))D.delete(w.id);else D.add(w.id);save();if(view==='diff')upd('diff');else if(view==='fc')fcDraw();else if(view==='rc')rDraw();else{b.textContent=(isD(w)?'★':'☆')+' Difficult';b.setAttribute('aria-pressed',isD(w))}}
  else if(a==='more'){LS[view].n+=60;upd(view)}
  else if(a==='drill'){F.deck='diff';F.fresh=true;go('fc')}
  else if(a==='show'){F.show=!F.show;fcDraw()}
  else if(a==='next'||a==='prev'){F.pos=F.ord.length?(F.pos+(a==='next'?1:-1)+F.ord.length)%F.ord.length:0;F.show=false;F.cnt=false;fcDraw()}
  else if(a==='pick'){R.res=R.w.art.split('/').includes(b.dataset.id)?'ok':'no';R.done=true;ST.add(R.w.id);save();rDraw()}
  else if(a==='rshow'){R.done=true;ST.add(R.w.id);save();rDraw()}
  else if(a==='knew'||a==='rnext')rNext();
  else if(a==='miss'){D.add(R.w.id);save();rNext()}
  else if(a==='spd')setSpeed(b.dataset.id);
  else if(a==='test')say(spoken((W.find(x=>x.de==='hallo')||W[0])),null,b);
  else if(a==='reset'&&confirm('Reset all progress, difficult words and counters?')){D.clear();ST.clear();H.clear();S.reviews=0;save();go('set')}
  return;
 }
 const n=e.target.closest('nav button');if(n)go(n.dataset.v);
});
$('#spd').innerHTML=opt(SPEEDS,S.speed);$('#spd').value=S.speed;
$('#spd').addEventListener('change',e=>setSpeed(e.target.value));
theme();go('list');
})();
</script>
